<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MaiBot Soundboard Overlay</title>
    <link rel="stylesheet" href="/soundboard.css" />
  </head>
  <body>
    <main class="stage" id="stage" aria-live="off">
      <button class="audio-unlock" id="audio-unlock" type="button" aria-label="Enable overlay audio"></button>
      <div class="effect-layer" id="effect-layer"></div>
      <div class="status-dot" id="status-dot" aria-hidden="true"></div>
    </main>
    <script src="/soundboard.js"></script>
  </body>
</html>
