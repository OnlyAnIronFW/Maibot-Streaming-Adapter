[project]
name = "maibot-bilibili-live-adapter"
version = "0.1.0"
description = "Input-only Bilibili live adapter with adaptive parameter-only Live2D control and game JSON bridge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.14",
    "httpx>=0.28.0",
    "maim-message==0.6.8",
    "maibot-plugin-sdk>=2.3.0",
    "mcp>=1.0.0",
    "numpy>=2.2.6",
    "openai>=1.95.0",
    "pillow>=11.3.0",
    "pydantic>=2.11.7",
    "pypinyin>=0.54.0",
    "sounddevice>=0.4.6",
    "tomlkit>=0.13.3",
]

[project.optional-dependencies]
# 本地语音（local_voice）的 sherpa-onnx 流式 ASR 运行时；不安装则该功能不可用
local-voice = ["sherpa-onnx>=1.12.39"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.12.2",
]

[project.urls]
Repository = "https://github.com/OnlyAnIronFW/Maibot-Streaming-Adapter"
Issues = "https://github.com/OnlyAnIronFW/Maibot-Streaming-Adapter/issues"

[tool.ruff]

include = ["*.py"]

# 行长度设置
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []

# 如果一个变量的名称以下划线开头，即使它未被使用，也不应该被视为错误或警告。
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# 启用的规则
select = [
    "E", # pycodestyle 错误
    "F", # pyflakes
    "B", # flake8-bugbear
]

ignore = ["E711", "E501"]
